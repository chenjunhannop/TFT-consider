[project]
name = "tft-consider"
version = "0.1.0"
description = "云顶之弈 AI 对局分析助手"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.5",
    "SQLAlchemy>=2.0",
    "httpx>=0.25",
    "beautifulsoup4>=4.12",
    "mss>=9.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
tft-consider = "tft_consider.main:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
